spring:
  application:
    name: frontline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/frontline}
    username: ${DB_USER:frontline}
    password: ${DB_PASSWORD:frontline_demo}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

simulator:
  enabled: false
  arrivalsPerMinute: 4
  weights:
    PHONE_ACCESS: 70
    APPOINTMENT: 20
    COMPUTER_ACCESS: 3
    JOB_SEARCH: 2
    DOCUMENT_SERVICES: 2
    BENEFITS_ASSISTANCE: 2
    OTHER: 1
  appointmentWeights:
    REEMPLOYMENT: 60
    CAREER_SERVICES: 30
    VETERANS: 10
