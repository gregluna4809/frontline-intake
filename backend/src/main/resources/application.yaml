spring:
  application:
    name: frontline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/frontline}
    username: ${DB_USER:frontline}
    password: ${DB_PASSWORD:frontline_demo}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

auth:
  jwt-secret: ${JWT_SECRET}

simulator:
  enabled: false
  arrivalsPerMinute: 4
  daily-arrivals:
    - {effective-from: null, min: 200, max: 250}
    - {effective-from: 2026-11-30, min: 250, max: 300}
  curve:
    "[08:30]": 3
    "[09:00]": 6
    "[09:30]": 6
    "[10:00]": 6
    "[10:30]": 6
    "[11:00]": 2
    "[11:30]": 2
    "[12:00]": 2
    "[12:30]": 2
    "[13:00]": 6
    "[13:30]": 6
    "[14:00]": 6
    "[14:30]": 6
    "[15:00]": 6
    "[15:30]": 4
    "[16:00]": 2
    "[16:30]": 1
  clerk-delay-minutes: {min: 1, max: 4}
  session-minutes:
    phone: {min: 15, max: 30}
    ui-account: {min: 20, max: 45}
    computer: {min: 30, max: 60}
    station: {min: 5, max: 15}
  leave-early-rate: 0.05
  tick-seconds: 5
  weights:
    PHONE_ACCESS: 70
    UI_ACCOUNT: 70
    APPOINTMENT: 20
    COMPUTER_ACCESS: 3
    JOB_SEARCH: 2
    DOCUMENT_SERVICES: 2
    BENEFITS_ASSISTANCE: 2
    OTHER: 1
  appointmentWeights:
    MANDATORY: 95
    JOB_SEARCH_ASSISTANCE: 5
