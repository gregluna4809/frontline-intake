spring:
  application:
    name: frontline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/frontline}
    username: ${DB_USER:frontline}
    password: ${DB_PASSWORD:frontline_demo}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
