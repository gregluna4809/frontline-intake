name: frontline
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: frontline
      POSTGRES_USER: frontline
      POSTGRES_PASSWORD: ${DB_PASSWORD:-frontline_demo}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontline -d frontline"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
